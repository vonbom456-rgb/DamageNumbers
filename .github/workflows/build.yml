name: Build DamageNumbers

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths:
      - "Source/**"
      - "DamageNumbers/**"
      - "DamageNumbers.sln"
      - "Plugin/**"
      - ".github/workflows/build.yml"

jobs:
  build:
    name: Build Release x64
    runs-on: windows-2022
    steps:
      - name: Checkout DamageNumbers
        uses: actions/checkout@v4

      - name: Checkout ArkApi 3.56 SDK
        shell: pwsh
        run: |
          git clone https://github.com/ArkServerApi/AseApi.git "$env:GITHUB_WORKSPACE\AseApi"
          Set-Location "$env:GITHUB_WORKSPACE\AseApi"
          git checkout f13b85979254b6b19c8d9255a0fc11c128978b8b
          "ARKAPI_ROOT=$env:GITHUB_WORKSPACE\AseApi" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Verify ArkApi 3.56
        shell: pwsh
        run: |
          $apiFile = Join-Path $env:ARKAPI_ROOT "version\Core\Private\Ark\ArkBaseApi.cpp"
          $content = Get-Content $apiFile -Raw
          if ($content -notmatch 'api_version\s*=\s*3\.56f') { throw "Not ArkApi 3.56" }
          if (!(Test-Path (Join-Path $env:ARKAPI_ROOT "out_lib\ArkApi.lib"))) { throw "ArkApi.lib missing" }

      - name: Add MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build DamageNumbers
        shell: pwsh
        run: |
          msbuild "$env:GITHUB_WORKSPACE\DamageNumbers.sln" /m /p:Configuration=Release /p:Platform=x64 /p:ARKAPI_ROOT="$env:ARKAPI_ROOT"

      - name: Prepare artifact
        shell: pwsh
        run: |
          $out = "$env:GITHUB_WORKSPACE\artifact\DamageNumbers"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          Copy-Item "$env:GITHUB_WORKSPACE\dist\DamageNumbers\DamageNumbers.dll" "$out\DamageNumbers.dll" -Force
          Copy-Item "$env:GITHUB_WORKSPACE\Plugin\config.json" "$out\config.json" -Force
          Copy-Item "$env:GITHUB_WORKSPACE\Plugin\PluginInfo.json" "$out\PluginInfo.json" -Force

      - name: Upload DamageNumbers
        uses: actions/upload-artifact@v4
        with:
          name: DamageNumbers-Release-x64
          path: artifact/DamageNumbers/
          if-no-files-found: error
          retention-days: 30
